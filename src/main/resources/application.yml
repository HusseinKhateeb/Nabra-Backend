spring:
  application:
    name: nabra-backend
  datasource:
    url: jdbc:postgresql://ep-jolly-unit-ag2asz3z-pooler.c-2.eu-central-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_y72RlzPbYqZu&sslmode=require&channelBinding=require
    # username: postgres
    # password: WKAB8lzpixs8i4SL
  jpa:
    hibernate:
      ddl-auto: update  # for scaffold/dev; use migrations in production
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

server:
  port: 8080
  tomcat:
    connection-timeout: 60000 # 60 seconds
    max-swallow-size: -1

app:
  security:
    jwt:
      # IMPORTANT: set a long, random secret in production (min 32 chars)
      secret: "change-me-change-me-change-me-change-me"
      expirationSeconds: 86400
  ai:
    # Optional microservices, enable by setting baseUrl(s)
    lipreading:
      baseUrl: ""
    prediction:
      baseUrl: ""
    stt:
      baseUrl: ""
    avsr:
      pythonCommand: "python"
      # Optional env var: AVSR_ASR_TIMEOUT_SECONDS (default 180)
      # Example: "{python} src/main/java/com/nabra/backend/modules/lipreading/avsrModels/3D ResNet-18/run_lip_file.py --video {video} --top-k {topK}"
      lip:
        command: '{python} "src/main/java/com/nabra/backend/modules/lipreading/avsrModels/3D ResNet-18/run_lip_file.py" --video {video} --top-k {topK} --use-mediapipe --json-only'
      # Example: "{python} src/main/java/com/nabra/backend/modules/lipreading/avsrModels/audio model/test_asr_ctc.py {audio}"
      audio:
        command: '{python} "src/main/java/com/nabra/backend/modules/lipreading/avsrModels/audio model/test_asr_ctc.py" {audio}'
      topK: 5
      timeoutSeconds: 60

